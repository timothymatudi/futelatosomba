# Redirect HTTP → HTTPS and www → apex
server {
    listen 80;
    server_name futelatosomba.cd www.futelatosomba.cd;
    return 301 https://futelatosomba.cd$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.futelatosomba.cd;
    ssl_certificate     /etc/letsencrypt/live/futelatosomba.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futelatosomba.cd/privkey.pem;
    return 301 https://futelatosomba.cd$request_uri;
}

server {
    listen 443 ssl http2;
    server_name futelatosomba.cd;

    ssl_certificate     /etc/letsencrypt/live/futelatosomba.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futelatosomba.cd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Max upload size for property images
    client_max_body_size 50M;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
