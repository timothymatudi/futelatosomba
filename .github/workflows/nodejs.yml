name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/futelatosomba-react-app/package-lock.json

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend/futelatosomba-react-app

    - name: Build frontend
      run: npm run build
      working-directory: frontend/futelatosomba-react-app
      env:
        CI: false

    - name: Install backend dependencies
      run: npm ci
      working-directory: backend
